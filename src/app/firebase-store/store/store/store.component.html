<div class="container my-5">
  <button class="btn btn-dark text-white w-25" (click)="show()">
    Add employee
  </button>
  @if (showInput) {
    <div class="form my-2">
      <form>
        <div class="inputs">
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Name"
            name="Name"
            [(ngModel)]="name"
          />
          <input
            type="text"
            class="form-control"
            id="salary"
            placeholder="Salary"
            name="Salary"
            [(ngModel)]="salary"
          />
          <input
            type="text"
            class="form-control"
            id="Duration"
            placeholder="Duration"
            name="Duration"
            [(ngModel)]="duration"
          />
        </div>
        <div class="text-center">
          <button class="btn btn-outline-primary mt-3 w-25" (click)="AddDoc()">
            Add
          </button>
        </div>
      </form>
    </div>
  }
  <div class="table-body my-4">
    @if (loading) {
      <h2 class="text-dark text-center py-2 rounded-3">loading...</h2>
      <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    } @else {
      <table class="table table-striped table-dark w-100">
        <thead>
          <tr>
            <th>id</th>
            <th class="text-center">Name</th>
            <th>Salary</th>
            <th>Duration</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          @for (item of employees; track item.id) {
            <tr>
              <td>{{ $index + 1 }}</td>
              <td class="text-center">{{ item.name }}</td>
              <td>${{ item.salary }}</td>
              <td>{{ item.workDuration }} years</td>
              <td class="text-center align-middle">
                <button
                  class="btn btn-outline-danger"
                  (click)="deleteDoc(item.id)"
                >
                  delete
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark ps-5 mb-4 bg-dark">
  <button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbarNav"
    aria-controls="navbarNav"
    aria-expanded="false"
    aria-label="Toggle navigation"
    (click)="log()"
  >
    <span class="navbar-toggler-icon"></span>
  </button>
  <div #id class="collapse navbar-collapse" [class.show]="open" id="navbarNav">
    <ul class="navbar-nav">
      @for (link of links; track $index) {
        <li class="nav-item active">
          <a
            class="nav-link mt-2 mb-2 p-2 ms-2"
            [routerLink]="link"
            routerLinkActive="bg-white text-dark p-2 rounded-2"
            >{{ link }}</a
          >
        </li>
      }
    </ul>
  </div>
</nav>
<router-outlet></router-outlet>
